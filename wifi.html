<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phong Cảnh SVG - Thẻ Kính QR</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(#0f172a, #334155);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    svg {
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      max-width: 100%;
    }
  </style>
</head>
<body>

<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="10" dy="15"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="frostedGlass">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.3"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out"/>
    </filter>
  </defs>

  <!-- Sky, Sun, Clouds, Hills, House, Trees... (giữ nguyên) -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  <g><circle cx="620" cy="120" r="60" fill="#FFEB3B" filter="url(#sunGlow)"/>
     <circle cx="620" cy="120" r="45" fill="#FFFD54"/></g>

  <ellipse cx="150" cy="80" rx="70" ry="35" fill="#fff" opacity="0.9"/>
  <ellipse cx="110" cy="65" rx="45" ry="30" fill="#fff"/>
  <ellipse cx="190" cy="70" rx="50" ry="32" fill="#fff"/>
  <ellipse cx="450" cy="50" rx="55" ry="28" fill="#fff" opacity="0.85"/>
  <ellipse cx="410" cy="45" rx="35" ry="25" fill="#fff"/>
  <ellipse cx="490" cy="48" rx="40" ry="26" fill="#fff"/>

  <path d="M0 380 Q200 300 400 380 Q600 280 800 380 L800 600 L0 600 Z" fill="#A5D6A7"/>
  <path d="M0 420 Q150 340 350 430 Q550 360 800 450 L800 600 L0 600 Z" fill="#81C784"/>
  <rect x="0" y="480" width="800" height="120" fill="#4CAF50"/>

  <!-- House -->
  <g transform="translate(180,320)">
    <rect x="20" y="80" width="120" height="100" rx="5" fill="#FFAB91" stroke="#263238" stroke-width="8"/>
    <polygon points="10,80 80,30 170,80" fill="#FF7043" stroke="#263238" stroke-width="8"/>
    <rect x="65" y="130" width="25" height="50" fill="#4A3728" rx="2"/>
    <rect x="110" y="100" width="25" height="35" fill="#E3F2FD" stroke="#263238" stroke-width="4"/>
    <line x1="122.5" y1="100" x2="122.5" y2="135" stroke="#263238" stroke-width="4"/>
    <line x1="110" y1="117" x2="135" y2="117" stroke="#263238" stroke-width="4"/>
  </g>

  <!-- Trees & Flowers (rút gọn) -->
  <g transform="translate(50,380)"><rect x="15" y="60" width="12" height="70" fill="#5D4037"/><ellipse cx="21" cy="45" rx="28" ry="22" fill="#388E3C"/><ellipse cx="21" cy="25" rx="22" ry="20" fill="#4CAF50"/><ellipse cx="21" cy="10" rx="18" ry="16" fill="#66BB6A"/></g>
  <g transform="translate(420,340)"><rect x="18" y="75" width="14" height="85" fill="#5D4037"/><ellipse cx="25" cy="55" rx="35" ry="28" fill="#2E7D32"/><ellipse cx="25" cy="32" rx="28" ry="24" fill="#388E3C"/><ellipse cx="25" cy="15" rx="20" ry="18" fill="#43A047"/></g>

  <!-- Card with external QR -->
  <g transform="translate(500,180)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="280" rx="35" ry="35" fill="#F8FAFC" opacity="0.93" stroke="#E2E8F0" stroke-width="14" filter="url(#frostedGlass)"/>
    <rect x="18" y="18" width="204" height="244" rx="26" ry="26" fill="none" stroke="#fff" stroke-width="8" opacity="0.75"/>

    <!-- QR từ file qrcode.svg -->
    <image x="35" y="58" width="170" height="170" xlink:href="WifiHome-1024.png" />

    <text x="120" y="40" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1E2937">Quét mã QR</text>
  </g>
</svg>

</body>
</html>
